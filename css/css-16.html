<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>16 - Media Queries</title>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; text-align: center; transition: background 0.3s; }
        .responsive-box { padding: 40px; color: white; font-size: 1.5rem; border-radius: 8px; }
        @media (max-width: 600px) { body { background: #e74c3c; } .responsive-box { background: #c0392b; } }
        @media (min-width: 601px) and (max-width: 1024px) { body { background: #f1c40f; color: #333; } .responsive-box { background: #f39c12; } }
        @media (min-width: 1025px) { body { background: #2ecc71; } .responsive-box { background: #27ae60; } }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">

</nav>

    <div class="responsive-box">Red: Mobile | Yellow: Tablet | Green: Desktop</div>
</body>
</html>
