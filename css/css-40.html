<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>40 - Image Hover Effect</title>
    <style>
        .img-container { width: 300px; height: 200px; overflow: hidden; border-radius: 10px; }
        .img-container img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
        .img-container:hover img { transform: scale(1.2); }
    </style>
</head>
