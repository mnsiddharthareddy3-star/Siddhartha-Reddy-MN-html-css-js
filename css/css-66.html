<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>66 - 2D & 3D Transformations</title>
    <style>
        body { display: flex; gap: 40px; padding: 50px; perspective: 500px; }
        .box-2d { width: 100px; height: 100px; background: #6c5ce7; transition: 0.5s; }
        .box-2d:hover { transform: skewX(15deg) scale(1.1); }
        .box-3d { width: 100px; height: 100px; background: #fd79a8; transition: 0.5s; }
        .box-3d:hover { transform: rotateY(180deg); }
    </style>
</head>

</nav>

    <div class="box-3d">3D Flip</div>
</body>
</html>
