<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>26 - Inheritance & Specificity</title>
    <style>
        body { font-family: sans-serif; color: blue; } /* Inherited by child elements */
        p { color: green; } /* Specificity 0,0,0,1 */
        .text { color: orange; } /* Specificity 0,0,1,0 (Overrides p) */
        #unique-text { color: red; } /* Specificity 0,1,0,0 (Overrides class) */
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <h2>CSS Specificity Hierarchy</h2>
    <p id="unique-text" class="text">This text will be RED because ID (#unique-text) has highest specificity.</p>
</body>
</html>
