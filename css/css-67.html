    <title>67 - Keyframe Animations</title>
    <style>
        .ball { width: 50px; height: 50px; background: #e17055; border-radius: 50%; position: relative; animation: bounce 1s infinite alternate ease-in; }
        @keyframes bounce {
            from { top: 0; }
            to { top: 200px; }
        }
    </style>
</head>
