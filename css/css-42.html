<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>42 - Button Hover Animation</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #0f172a; }
        .btn { position: relative; padding: 15px 40px; color: #38bdf8; font-size: 1.1rem; border: 2px solid #38bdf8; border-radius: 30px; text-decoration: none; overflow: hidden; transition: 0.4s; font-family: sans-serif; }
        .btn:hover { color: white; background: #38bdf8; box-shadow: 0 0 20px #38bdf8; }
    </style>
</head>
