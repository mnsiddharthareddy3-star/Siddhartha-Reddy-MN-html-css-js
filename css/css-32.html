<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>32 - Box & Text Shadow</title>
    <style>
        body { font-family: sans-serif; padding: 40px; background: #f4f4f4; }
        .shadow-box {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
        }
        .shadow-text {
            font-size: 2.5rem;
            color: #2c3e50;
            text-shadow: 3px 3px 5px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <div class="shadow-box">
        <h1 class="shadow-text">Text Shadow Effect</h1>
        <p>This box features elevated CSS box-shadow.</p>
    </div>
</body>
</html>
