<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>01 - Inline, Internal, and External CSS</title>
    <!-- External CSS link demonstration -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* Internal CSS */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; line-height: 1.6; }
        .internal-box { background-color: #e0f7fa; color: #006064; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #b2ebf2; }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <h1>01 - Demonstrating CSS Types</h1>
    <div class="internal-box">
        <h3>Internal CSS Applied</h3>
        <p>This box is styled using the &lt;style&gt; tag in the HTML head.</p>
    </div>
    <div style="background-color: #ffe0b2; color: #e65100; padding: 15px; border-radius: 8px; border: 1px solid #ffe0b2;">
        <h3>Inline CSS Applied</h3>
        <p>This box is styled using the inline 'style' attribute directly on the tag.</p>
    </div>
</body>
</html>
