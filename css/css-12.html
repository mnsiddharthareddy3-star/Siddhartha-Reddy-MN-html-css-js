<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>12 - Styled Lists and Tables</title>
    <style>
        body { font-family: sans-serif; padding: 30px; }
        ul.custom-list { list-style: square; color: #2980b9; line-height: 1.8; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 12px; text-align: left; }
        th { background-color: #2c3e50; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <h2>Styled List & Zebra Table</h2>
    <ul class="custom-list">
        <li>Custom Square Bullet Item 1</li>
        <li>Custom Square Bullet Item 2</li>
    </ul>
    <table>
        <tr><th>ID</th><th>Name</th><th>Role</th></tr>
        <tr><td>1</td><td>Alice</td><td>Developer</td></tr>
        <tr><td>2</td><td>Bob</td><td>Designer</td></tr>
    </table>
</body>
</html>
