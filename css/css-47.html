<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>47 - CSS Grid Dashboard</title>
    <style>
        body { font-family: sans-serif; margin: 0; }
        .dashboard { display: grid; grid-template-columns: 200px 1fr; height: 100vh; }
        .sidebar { background: #2c3e50; color: white; padding: 20px; }
        .main-content { background: #ecf0f1; padding: 20px; display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; height: max-content; }
        .widget { background: white; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <div class="dashboard">
        <div class="sidebar"><h3>Dashboard</h3></div>
        <div class="main-content">
            <div class="widget">Widget 1</div>
            <div class="widget">Widget 2</div>
        </div>
    </div>
</body>
</html>
