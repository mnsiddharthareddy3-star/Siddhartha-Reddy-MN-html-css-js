<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>17 - Transitions & Transformations</title>
    <style>
        body { display: flex; justify-content: center; align-items: center; height: 100vh; background: #1a1a2e; margin: 0; }
        .card { width: 150px; height: 150px; background: #e94560; border-radius: 12px; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; align-items: center; justify-content: center; color: white; font-family: sans-serif; font-weight: bold; cursor: pointer; }
        .card:hover { transform: scale(1.15) rotate(10deg); background: #0f3460; box-shadow: 0 15px 30px rgba(0,0,0,0.5); }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <div class="card">Hover Me!</div>
</body>
</html>
