<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>70 - CSS Only Modal</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal:target { display: flex; }
        .modal-content { background: white; padding: 30px; border-radius: 8px; position: relative; }
        .close { position: absolute; top: 10px; right: 10px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <a href="#demo-modal">Open Modal</a>
    <div id="demo-modal" class="modal">
        <div class="modal-content">
            <a href="#" class="close">&times;</a>
            <h2>Pure CSS Modal</h2>
            <p>This modal works without JavaScript using :target pseudo-class.</p>
        </div>
    </div>
</body>
</html>
