<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>69 - Sliding Card</title>
    <style>
        body { font-family: sans-serif; padding: 40px; overflow: hidden; }
        .slide-card { width: 250px; padding: 20px; background: #fdcb6e; border-radius: 8px; animation: slideIn 1s forwards ease-out; }
        @keyframes slideIn {
            from { transform: translateX(-100vw); }
            to { transform: translateX(0); }
        }
    </style>
</head>
