<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>24 - Responsive Photo Gallery</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #111; color: white; }
        .gallery { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; }
        .gallery-item { background: #333; height: 150px; border-radius: 8px; display: flex; align-items: center; justify-content: center; font-weight: bold; transition: transform 0.3s; }
        .gallery-item:hover { transform: scale(1.05); background: #555; }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">

<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>

        <div class="gallery-item">Photo 1</div>

</body>
</html>
