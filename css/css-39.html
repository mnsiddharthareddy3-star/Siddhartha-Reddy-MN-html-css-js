<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>39 - Dropdown Menu</title>
    <style>
        body { font-family: sans-serif; padding: 40px; }
        .dropdown { position: relative; display: inline-block; }
        .dropbtn { background: #3498db; color: white; padding: 12px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .dropdown-content { display: none; position: absolute; background: #f9f9f9; min-width: 160px; box-shadow: 0 8px 16px rgba(0,0,0,0.2); border-radius: 4px; }
        .dropdown-content a { color: black; padding: 12px 16px; text-decoration: none; display: block; }
        .dropdown-content a:hover { background: #f1f1f1; }
        .dropdown:hover .dropdown-content { display: block; }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">

<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>

        <button class="dropbtn">Hover Dropdown</button>
        <div class="dropdown-content">
            <a href="#">Link 1</a>
            <a href="#">Link 2</a>
            <a href="#">Link 3</a>
        </div>
    </div>
</body>
</html>
