<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>41 - CSS Tooltip</title>
    <style>
        body { font-family: sans-serif; padding: 100px; }
        .tooltip { position: relative; display: inline-block; border-bottom: 1px dashed #333; cursor: pointer; }
        .tooltip .tooltiptext { visibility: hidden; width: 120px; background-color: #333; color: #fff; text-align: center; border-radius: 6px; padding: 5px; position: absolute; z-index: 1; bottom: 125%; left: 50%; transform: translateX(-50%); opacity: 0; transition: opacity 0.3s; }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <div class="tooltip">Hover over me
        <span class="tooltiptext">Tooltip text!</span>
    </div>
</body>
</html>
