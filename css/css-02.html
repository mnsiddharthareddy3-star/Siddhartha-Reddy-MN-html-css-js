<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>02 - CSS Selectors</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: sans-serif; padding: 20px; }
        h1 { color: #2c3e50; } /* Element Selector */
        #main-header { border-bottom: 2px solid #3498db; padding-bottom: 10px; } /* ID Selector */
        .highlight { background-color: #f1c40f; padding: 2px 5px; border-radius: 3px; } /* Class Selector */
        input[type="text"] { border: 2px solid #2ecc71; padding: 8px; border-radius: 4px; } /* Attribute Selector */
    </style>
</head>
<body><nav style="padding:14px 18px;background:#111827;display:flex;gap:10px;flex-wrap:wrap;">
<a href="../index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#4f46e5;border-radius:8px;">Home</a>
<a href="index.html" style="color:white;text-decoration:none;padding:8px 12px;background:#334155;border-radius:8px;">Back to CSS Programs</a>
</nav>
    <h1 id="main-header">02 - CSS Selectors Demo</h1>
    <p>This is a paragraph with <span class="highlight">highlighted class</span> text.</p>
    <form>
        <label>Name: <input type="text" placeholder="Attribute selector target"></label>
    </form>
</body>
</html>
