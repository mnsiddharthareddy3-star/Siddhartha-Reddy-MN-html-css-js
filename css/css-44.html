<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>44 - Object Fit & Position</title>
    <style>
        body { font-family: sans-serif; display: flex; gap: 20px; padding: 40px; }
        .box { width: 200px; height: 150px; border: 2px solid red; }
        img { width: 100%; height: 100%; }
        .cover { object-fit: cover; }
        .contain { object-fit: contain; }
    </style>
</head>
